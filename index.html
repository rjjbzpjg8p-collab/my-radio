<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Mein Radio"><title>Mein Radio</title><style>body{margin:0;background:#101827;color:#f9fafb;font:16px -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:600px;margin:auto;padding:24px 18px 120px}h1{font-size:30px}small{color:#b9c3d4}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.station{border:2px solid transparent;border-radius:18px;min-height:110px;background:#24334b;color:white;font-size:19px;font-weight:700;padding:14px;overflow-wrap:anywhere}.station.active{border-color:#8ed1ff;background:#31527d}.station.add{background:#263e38}.player{position:fixed;bottom:0;left:0;right:0;background:#1e293b;padding:16px max(18px,env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 -8px 30px #0005}.player button,.action{border:0;border-radius:14px;background:#78c8ff;color:#0b1625;padding:13px 18px;font-weight:700;font-size:17px}.secondary{background:#34445e;color:white}.modal{background:#1e293b;border:1px solid #52627a;border-radius:18px;padding:20px;color:white;width:min(85vw,440px)}input{width:100%;box-sizing:border-box;padding:12px;margin:6px 0 14px;border-radius:9px;border:1px solid #77869b;font-size:16px}label{display:block}menu{display:flex;gap:8px;padding:0;flex-wrap:wrap}#status{font-size:13px;color:#d0d9e8}button{cursor:pointer}button:focus-visible{outline:3px solid #fff}</style></head><body><main><h1>📻 Mein Radio</h1><p><small>Sender antippen und hören · Sender über + ergänzen</small></p><div class="grid" id="stations"></div><p><button class="action secondary" id="manage">Sender verwalten</button></p><p id="status" role="status">Bereit</p></main><div class="player"><div><small>AKTUELLER SENDER</small><div id="current"><b>Keiner ausgewählt</b></div></div><button id="toggle" aria-label="Wiedergabe starten oder pausieren">▶ Start</button></div><audio id="audio" preload="none"></audio><dialog id="editor" class="modal"><form id="form"><h2 id="dialogTitle">Sender hinzufügen</h2><input type="hidden" id="editId"><label>Sendername<input id="name" required maxlength="60" placeholder="z. B. Bremen Vier"></label><label>Direkte Stream-Adresse (https://...)<input id="url" type="url" required pattern="https://.*" placeholder="https://.../stream.mp3"></label><menu><button type="button" class="action secondary" id="cancel">Abbrechen</button><button type="button" class="action secondary" id="remove" hidden>Löschen</button><button class="action" type="submit">Speichern</button></menu></form></dialog><script>
const defaults=[{id:'wdr2',name:'WDR 2 Ruhrgebiet',url:'https://wdr-wdr2-ruhrgebiet.icecastssl.wdr.de/wdr/wdr2/ruhrgebiet/mp3/128/stream.mp3'},{id:'wdr4',name:'WDR 4',url:'https://wdr-wdr4-live.icecastssl.wdr.de/wdr/wdr4/live/mp3/128/stream.mp3'},{id:'wdr5',name:'WDR 5',url:'https://wdr-wdr5-live.icecastssl.wdr.de/wdr/wdr5/live/mp3/128/stream.mp3'},{id:'bremen1',name:'Bremen Eins',url:'https://icecast.radiobremen.de/rb/bremeneins/live/mp3/128/stream.mp3'},{id:'relax',name:'Absolut Relax',url:'https://absolut-relax.live-sm.absolutradio.de/absolut-relax/stream/mp3'}];
const key='mein-radio-sender-v1';let stations;try{const stored=JSON.parse(localStorage.getItem(key));stations=Array.isArray(stored)?stored:defaults}catch{stations=defaults}let selected=null,manage=false;const $=id=>document.getElementById(id),audio=$('audio');function save(){localStorage.setItem(key,JSON.stringify(stations))}function render(){const grid=$('stations');grid.replaceChildren();stations.forEach(s=>{const b=document.createElement('button');b.className='station'+(selected===s.id?' active':'');b.textContent=(manage?'✎ ':'♫ ')+s.name;b.onclick=()=>manage?edit(s):play(s);grid.append(b)});const plus=document.createElement('button');plus.className='station add';plus.textContent='＋ Sender';plus.onclick=()=>edit();grid.append(plus);$('manage').textContent=manage?'Fertig':'Sender verwalten'}function edit(s){$('form').reset();$('editId').value=s?.id||'';$('name').value=s?.name||'';$('url').value=s?.url||'';$('dialogTitle').textContent=s?'Sender bearbeiten':'Sender hinzufügen';$('remove').hidden=!s;$('editor').showModal()}$('cancel').onclick=()=>$('editor').close();$('manage').onclick=()=>{manage=!manage;render()};$('form').onsubmit=e=>{e.preventDefault();const id=$('editId').value||('custom-'+Date.now()),name=$('name').value.trim(),url=$('url').value.trim();if(!name||!url.startsWith('https://'))return;const idx=stations.findIndex(s=>s.id===id);if(idx<0)stations.push({id,name,url});else stations[idx]={id,name,url};save();render();$('editor').close()};$('remove').onclick=()=>{const id=$('editId').value;if(!confirm('Sender wirklich löschen?'))return;stations=stations.filter(s=>s.id!==id);if(selected===id){audio.pause();audio.removeAttribute('src');selected=null;$('current').textContent='Keiner ausgewählt'}save();render();$('editor').close()};async function play(s){selected=s.id;audio.src=s.url;$('current').textContent=s.name;$('status').textContent='Verbinde mit '+s.name+' …';render();try{await audio.play()}catch(e){$('status').textContent='Wiedergabe nicht möglich. Bitte Stream-Adresse prüfen.'}}$('toggle').onclick=async()=>{if(!audio.src){if(stations.length)await play(stations[0]);return}if(audio.paused){try{await audio.play()}catch{$('status').textContent='Wiedergabe fehlgeschlagen.'}}else audio.pause()};audio.onplaying=()=>{$('toggle').textContent='Ⅱ Pause';$('status').textContent='Live-Wiedergabe'};audio.onpause=()=>{$('toggle').textContent='▶ Start'};audio.onerror=()=>{$('status').textContent='Stream nicht erreichbar oder Format nicht unterstützt.'};if('mediaSession' in navigator){audio.onplay=()=>{const s=stations.find(s=>s.id===selected);if(s)navigator.mediaSession.metadata=new MediaMetadata({title:s.name,artist:'Mein Radio'})}}render();
</script></body></html>
